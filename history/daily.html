<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI DAILY LOG — 日次AIニュース</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e5ff">
<meta name="description" content="毎朝更新されるAI業界の日次ニュースログ。カレンダーで日付を選ぶと、その日の重要ニュースをカードで読める。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ウェイトは実際に使っているものだけ並べる。Noto Sans JP は和文の字数が多く、
     Google Fonts が1ウェイトあたり100以上の @font-face に分割して配信するため、
     使わないウェイトを1つ足すだけでこの定義CSSが数十KB膨らむ（全ページ共通の初期コスト）。
     Noto: 300=ヒーロー副題 / 400=本文 / 700=強調。500は使用箇所ゼロなので載せない。
     セクション見出しは font-weight: 600 だが、Noto に600が無いため700で描画される。
     JetBrains Mono: 400=本文 / 700=<strong>。600は使用箇所ゼロ。
     Orbitron: 400・600・800とも使用中。
     追加するときは、先に実際の描画ウェイトを数えてから増やすこと。 -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+JP:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="analytics.js"></script>
<style>
:root {
  --bg: #05060f;
  --bg-2: #0a0d1f;
  --cyan: #00e5ff;
  --magenta: #ff2ee6;
  --violet: #8b5cf6;
  --green: #00ffa3;
  --amber: #ffb547;
  --coral: #ff7a5c;
  --blue: #5c9dff;
  --text: #e6ecff;
  --text-dim: #8a94b8;
  --card: rgba(20, 25, 55, 0.55);
  --border: rgba(0, 255, 163, 0.18);
  /* 固定ナビの実高さ。JSが実測値で上書きする（フォントの読み込みやロゴの折り返しで変わるため） */
  --nav-h: 64px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  overflow-x: hidden;
  line-height: 1.8;
}

#neural-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.45; }

.grid-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(0, 255, 163, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 163, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 75%);
}

.content { position: relative; z-index: 2; }

.daily-content {
  max-width: 100%;
  touch-action: pan-y;
  overscroll-behavior-x: contain;
  contain: layout;
}

/* ===== Nav ===== */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  /* space-between ではなくロゴ側の margin-right: auto で右寄せする。
     ページごとに検索ボックスの有無が違っても並びが崩れないため。 */
  display: flex; align-items: center; gap: 14px;
  padding: 14px 32px;
  background: rgba(5, 6, 15, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  margin-right: auto;
  font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1.05rem;
  letter-spacing: 0.18em;
  background: linear-gradient(90deg, var(--green), var(--cyan));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ナビのリンクは「別ページへの遷移」だけを担う。行き先ごとに色を固定したピルで、
   PCでもスマホでも同じ見た目・同じ並び順で出す。ページ内の移動は .section-bar が受け持つ。

   ただし「並び方が共通」なだけで、リンクの顔ぶれはページごとに違う。
   全ページに6枚すべてを並べる設計ではなく、関係の近いページだけを置き、
   遠いページはその近いページを経由して辿らせる:
     - archive は news の過去ログなので、入口は news からの1本だけにする
     - generative は index の生成AI期を掘り下げた続きなので、戻り先は index にする
   ピルが増えるとスマホのナビが2段になり、どれが主役の行き先か分からなくなるため、
   ここは意図的に絞っている。リンクを足すときは「このページの続きか」で判断する。 */
.nav-links { display: flex; gap: 10px; align-items: center; }

.nav-links a {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; letter-spacing: 0.06em;
  text-decoration: none; white-space: nowrap;
  border-radius: 999px; padding: 5px 14px;
  color: rgb(var(--pill));
  border: 1px solid rgba(var(--pill), 0.35);
  background: rgba(var(--pill), 0.06);
  transition: background 0.25s, box-shadow 0.25s;
}
.nav-links a:hover {
  background: rgba(var(--pill), 0.14);
  box-shadow: 0 0 14px rgba(var(--pill), 0.4);
}

/* 行き先ごとの色。全ページで同じ色が同じ行き先を指す。 */
.to-history  { --pill: 0, 229, 255; }
.to-gen      { --pill: 255, 46, 230; }
.to-news     { --pill: 0, 255, 163; }
.to-daily    { --pill: 255, 181, 71; }
.to-archive  { --pill: 138, 148, 184; }
.to-glossary { --pill: 139, 92, 246; }

/* ===== Hero ===== */
.hero {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 118px 24px 26px;
}

.hero-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
  color: var(--green);
  border: 1px solid rgba(0,255,163,0.4); border-radius: 999px;
  padding: 6px 20px; margin-bottom: 22px;
  background: rgba(0,255,163,0.06);
  animation: pulse-border 3s ease-in-out infinite;
}
@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 8px rgba(0,255,163,0.25); }
  50% { box-shadow: 0 0 22px rgba(0,255,163,0.55); }
}

.hero h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 800;
  font-size: clamp(1.8rem, 5.5vw, 3.6rem);
  letter-spacing: 0.1em; line-height: 1.15;
  background: linear-gradient(120deg, var(--green) 0%, var(--cyan) 55%, var(--violet) 100%);
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: gradient-shift 6s ease infinite;
}
@keyframes gradient-shift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.hero h2 {
  margin-top: 14px; font-weight: 300;
  font-size: clamp(0.85rem, 2vw, 1.1rem);
  color: var(--text-dim); letter-spacing: 0.22em;
}

/* ===== Calendar ===== */
.cal-wrap { max-width: 560px; margin: 0 auto; padding: 0 24px 8px; }

.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 14px;
}

.cal-title {
  font-family: 'Orbitron', sans-serif; font-size: 1.02rem;
  letter-spacing: 0.12em; color: var(--text); flex: 1; text-align: center;
}

.cal-nav {
  flex: 0 0 auto;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(0,255,163,0.06);
  color: var(--green); font-size: 0.85rem; line-height: 1;
  cursor: pointer; transition: box-shadow 0.25s;
}
.cal-nav:hover:not(:disabled) { box-shadow: 0 0 14px rgba(0,255,163,0.4); }
.cal-nav:disabled { opacity: 0.22; cursor: default; }

.cal-latest {
  flex: 0 0 auto;
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  color: var(--cyan);
  border: 1px solid rgba(0,229,255,0.35);
  background: rgba(0,229,255,0.06);
  border-radius: 999px; padding: 5px 13px; cursor: pointer;
  transition: box-shadow 0.25s;
}
.cal-latest:hover { box-shadow: 0 0 14px rgba(0,229,255,0.4); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.cal-dow {
  text-align: center; padding-bottom: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
  color: var(--text-dim); letter-spacing: 0.1em;
}
.cal-dow.sun { color: var(--coral); }
.cal-dow.sat { color: var(--blue); }

.cal-cell {
  aspect-ratio: 1 / 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,0.07);
  background: rgba(20,25,55,0.4);
  font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
  color: var(--text-dim);
}
.cal-cell.empty { border-color: transparent; background: transparent; }

.cal-cell.has-news {
  color: var(--green);
  border-color: rgba(0,255,163,0.45);
  background: rgba(0,255,163,0.07);
  text-shadow: 0 0 10px rgba(0,255,163,0.55);
  cursor: pointer;
  transition: box-shadow 0.25s, transform 0.25s;
}
.cal-cell.has-news:hover { box-shadow: 0 0 16px rgba(0,255,163,0.35); transform: translateY(-2px); }
.cal-cell.has-news:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.cal-cell.selected {
  background: var(--green); color: var(--bg);
  border-color: var(--green); text-shadow: none;
  box-shadow: 0 0 22px rgba(0,255,163,0.55);
}

.cal-count { font-size: 0.56rem; letter-spacing: 0.04em; opacity: 0.85; }
.cal-cell.selected .cal-count { opacity: 0.7; }

/* ===== Selected day ===== */
.day-head {
  max-width: 1100px; margin: 0 auto;
  padding: 34px 24px 0;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.day-head h2 {
  font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
  font-size: clamp(1.05rem, 3vw, 1.45rem); font-weight: 600;
  letter-spacing: 0.05em; color: var(--green);
  /* nav は position: fixed。スマホではロゴが2行に折り返して85px前後まで伸びるため、
     64px 固定だとスワイプ後の scrollIntoView で日付がナビの下に潜り込む。 */
  scroll-margin-top: calc(var(--nav-h) + 18px);
}
.day-head .day-count {
  font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-dim);
}
.day-head .day-line {
  flex: 1; height: 1px; min-width: 40px;
  background: linear-gradient(90deg, rgba(0,255,163,0.6), transparent);
}

.cards-wrap { max-width: 1100px; margin: 0 auto; padding: 26px 24px 10px; }

.news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 18px; }

.news-card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 22px 24px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  opacity: 0; transform: translateY(24px);
  display: flex; flex-direction: column;
  align-items: flex-start;
}
.news-card.visible {
  opacity: 1; transform: translateY(0);
  transition: opacity 0.55s, transform 0.55s, box-shadow 0.3s;
}
.news-card:hover { box-shadow: 0 8px 36px rgba(0,255,163,0.12); }

.news-card .kicker {
  font-family: 'JetBrains Mono', monospace; font-size: 0.64rem;
  letter-spacing: 0.14em; margin-bottom: 6px; color: var(--cyan);
}
.news-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.55; }
.news-card p { font-size: 0.83rem; color: var(--text-dim); line-height: 1.75; flex: 1; }
.news-card strong { color: var(--text); }
.news-card:has(.point-list) p { flex: 0 0 auto; }


.news-card .point-list {
  list-style: none;
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.news-card .point-list li {
  font-size: 0.83rem;
  color: var(--text-dim);
  line-height: 1.75;
}

.card-src {
  margin-top: 14px; padding-top: 10px; width: 100%;
  border-top: 1px dashed rgba(255,255,255,0.12);
  font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
  color: var(--green); text-decoration: none;
  transition: text-shadow 0.25s;
}
.card-src:hover { text-shadow: 0 0 10px rgba(0,255,163,0.7); }

#empty-state {
  max-width: 1100px; margin: 0 auto; padding: 60px 24px;
  text-align: center; color: var(--coral);
  font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
}
#empty-state[hidden] { display: none; }

.audio-panel {
  max-width: 1100px; margin: 26px auto 0; padding: 0 24px;
}
.audio-panel[hidden] { display: none; }
.audio-inner {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 18px 22px; border: 1px solid rgba(0,229,255,0.28);
  border-radius: 12px; background: rgba(0,229,255,0.06);
  box-shadow: 0 0 26px rgba(0,229,255,0.08);
}
/* 狭い画面での並び。DOM上のキッカー／見出し／操作群（速度＋視聴済み）を、
   「視聴済み」はキッカー行の右端、速度ボタンはタイトルの右下へグリッドで置き直す。 */
.audio-copy {
  flex: 1 1 220px; min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "kicker heard"
    "title  title"
    ".      speed";
  align-items: center;
}
/* 中身を直接グリッドに並べるため、箱自体は無かったことにする。 */
.audio-actions { display: contents; }
.audio-kicker {
  grid-area: kicker;
  color: var(--cyan); font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.12em;
}
.audio-heard-label {
  grid-area: heard; justify-self: end;
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-dim); font-size: 0.68rem; white-space: nowrap; cursor: pointer;
}
.audio-heard-label input {
  width: 15px; height: 15px; margin: 0; accent-color: var(--green); cursor: pointer;
}
.audio-heard-label input:disabled { cursor: default; }
.audio-copy h3 { grid-area: title; font-size: 0.98rem; margin-top: 3px; }
.audio-speed {
  grid-area: speed; justify-self: end; margin-top: 2px;
  display: flex; gap: 4px;
}
.audio-speed button {
  border: 1px solid rgba(0,229,255,0.28); border-radius: 999px;
  min-width: 48px; padding: 3px 8px; background: transparent; color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
  text-align: center; cursor: pointer;
  transition: color 0.25s, border-color 0.25s, background 0.25s;
}
.audio-speed button.is-active {
  border-color: var(--cyan); background: rgba(0,229,255,0.12); color: var(--cyan);
}
.audio-speed button:disabled { opacity: 0.35; cursor: default; }
.audio-controls {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  flex: 1 1 560px; min-width: 240px;
}
/* 再生の実体。自作UIに置き換えたので見せないが、レイアウトから外すだけにとどめる。 */
.audio-player {
  position: absolute; width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}

.audio-ui {
  flex: 1 1 auto; min-width: 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.audio-seek-row { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; min-width: 0; }
.audio-btn-row { flex: 1 1 100%; display: flex; align-items: center; justify-content: center; gap: 12px; }

/* 900px以上では1行に組み直す（操作ボタンを左、シークバーを右へ伸ばす）。
   2行のままだとプレイヤーが縦に伸び、下の @media (min-width: 900px) で
   右列の上段に置いている速度ボタン・「視聴済み」の行が押し下げられるため。 */
@media (min-width: 900px) {
  .audio-btn-row { flex: 0 0 auto; order: -1; }
  .audio-seek-row { flex: 1 1 auto; }
}

.audio-time {
  flex: 0 0 auto; min-width: 40px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
  color: var(--text-dim); font-variant-numeric: tabular-nums;
}
/* 桁が増減しても左右の余白が動かないよう、終端側は右寄せにする。 */
.audio-time-end { text-align: right; }

.audio-seek { position: relative; flex: 1 1 auto; min-width: 60px; height: 18px; display: flex; align-items: center; }
.audio-seek-track {
  position: absolute; left: 0; right: 0; height: 4px;
  border-radius: 999px; background: rgba(0,229,255,0.15); overflow: hidden;
}
.audio-seek-buffered, .audio-seek-played {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
}
.audio-seek-buffered { background: rgba(0,229,255,0.22); }
.audio-seek-played { background: linear-gradient(90deg, var(--green), var(--cyan)); }

/* 透明なつまみ操作レイヤー。トラックのdivより後ろのDOM順なので上に重なる。 */
.audio-seek-input {
  position: relative; width: 100%; height: 18px; margin: 0;
  background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
.audio-seek-input::-webkit-slider-runnable-track { height: 18px; background: transparent; }
.audio-seek-input::-moz-range-track { height: 18px; background: transparent; }
.audio-seek-input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 13px; height: 13px; margin-top: 2.5px; border: none; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.75);
}
.audio-seek-input::-moz-range-thumb {
  width: 13px; height: 13px; border: none; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.75);
}
.audio-seek-input:focus { outline: none; }
.audio-seek-input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(0,229,255,0.35), 0 0 10px rgba(0,229,255,0.75); }
.audio-seek-input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px rgba(0,229,255,0.35), 0 0 10px rgba(0,229,255,0.75); }
.audio-seek-input:disabled { cursor: default; }
.audio-seek-input:disabled::-webkit-slider-thumb { background: var(--text-dim); box-shadow: none; }
.audio-seek-input:disabled::-moz-range-thumb { background: var(--text-dim); box-shadow: none; }

.audio-play {
  flex: 0 0 auto;
  width: 44px; height: 44px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent;
  color: var(--cyan); cursor: pointer;
  transition: color 0.25s, filter 0.25s;
}
.audio-play:hover:not(:disabled) {
  background: transparent; filter: drop-shadow(0 0 7px rgba(0,229,255,0.75));
}
.audio-play:disabled { opacity: 0.35; cursor: default; }
.audio-play svg { width: 28px; height: 28px; display: block; fill: currentColor; }
/* 再生中かどうかで三角と二本線を入れ替える。 */
.audio-play .icon-pause { display: none; }
.audio-play.is-playing .icon-play { display: none; }
.audio-play.is-playing .icon-pause { display: block; }

.audio-skip {
  flex: 0 0 auto;
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; color: var(--cyan);
  cursor: pointer;
  transition: box-shadow 0.25s, background 0.25s;
}
.audio-skip:hover:not(:disabled) {
  background: rgba(0,229,255,0.08);
  box-shadow: 0 0 12px rgba(0,229,255,0.25);
}
.audio-skip:disabled { opacity: 0.35; cursor: default; }
.audio-skip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.audio-skip-icon { width: 34px; height: 34px; display: block; overflow: visible; }
.audio-skip-number {
  fill: currentColor; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; text-anchor: middle;
  paint-order: stroke fill; stroke: var(--bg); stroke-width: 2px; stroke-linejoin: round;
}

/* 900px以上（iPad・PC）では、速度ボタンと「視聴済み」をパネル右上（プレイヤーの真上）へ
   まとめて移す。狭い画面と同じ縦積みのままだと、右半分はプレイヤー1行だけなのに左半分は
   文字が3行あり、右上に大きな余白が空いて間延びして見えるため。
   左列に文字、右列に操作群とプレイヤーを縦に2段、という2列のグリッドで組む。 */
@media (min-width: 900px) {
  .audio-inner {
    display: grid;

<script>
/* ===== Neural network background (green tint) ===== */
const canvas = document.getElementById('neural-bg');
const ctx = canvas.getContext('2d');
let W, H;
const nodes = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NODE_COUNT = Math.min(90, Math.floor(window.innerWidth / 16));
const COLORS = ['0,255,163', '0,229,255', '139,92,246', '255,181,71'];

for (let i = 0; i < NODE_COUNT; i++) {
  nodes.push({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    r: Math.random() * 1.8 + 0.8,
    c: COLORS[Math.floor(Math.random() * COLORS.length)]
  });
}

const mouse = { x: -9999, y: -9999 };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

function draw() {
  ctx.clearRect(0, 0, W, H);
  const LINK = 140;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    a.x += a.vx; a.y += a.vy;
    if (a.x < 0 || a.x > W) a.vx *= -1;
    if (a.y < 0 || a.y > H) a.vy *= -1;
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < LINK) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(${a.c},${(1 - d / LINK) * 0.2})`;
        ctx.lineWidth = 0.6;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
    const mdx = a.x - mouse.x, mdy = a.y - mouse.y;
    const md = Math.sqrt(mdx * mdx + mdy * mdy);
    if (md < 180) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(0,255,163,${(1 - md / 180) * 0.4})`;
      ctx.lineWidth = 0.8;
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(mouse.x, mouse.y);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.fillStyle = `rgba(${a.c},0.85)`;
    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

/* ===== 固定ナビの高さを --nav-h に同期する =====
   日付見出しの scroll-margin-top がこの値を使う。ロゴの折り返し・フォント読み込み・
   画面回転で高さが変わるので、ResizeObserver で追従させる。 */
const navEl = document.querySelector('nav');
const syncNavHeight = () =>
  document.documentElement.style.setProperty('--nav-h', Math.round(navEl.getBoundingClientRect().height) + 'px');
syncNavHeight();
new ResizeObserver(syncNavHeight).observe(navEl);

/* ===== Progress bar ===== */
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const p = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
  document.getElementById('progress').style.width = p + '%';
}, { passive: true });

/* ===== 日次ログデータ ===== */
const DATA = window.DAILY_NEWS || {};
const AUDIO = window.DAILY_AUDIO || {};
const DATES = Object.keys(DATA).sort();
const LATEST = DATES.length ? DATES[DATES.length - 1] : null;
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

const calTitle = document.getElementById('cal-title');
const calGrid = document.getElementById('cal-grid');
const prevBtn = document.getElementById('cal-prev');
const nextBtn = document.getElementById('cal-next');
const latestBtn = document.getElementById('cal-latest');
const emptyState = document.getElementById('empty-state');
const dailyContent = document.getElementById('daily-content');

function ym(dateStr) { return dateStr.slice(0, 7); }

const MONTHS = [...new Set(DATES.map(ym))].sort();
const MIN_MONTH = MONTHS[0] || null;
const MAX_MONTH = MONTHS.length ? MONTHS[MONTHS.length - 1] : null;

let selected = null;
let viewMonth = LATEST ? ym(LATEST) : null;

/* "YYYY-MM" を delta か月ずらす。年またぎは Date に任せる。 */
function shiftMonth(month, delta) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
}

function renderCalendar() {
  if (!viewMonth) return;
  const [y, m] = viewMonth.split('-').map(Number);
  calTitle.textContent = y + '年 ' + m + '月';
  prevBtn.disabled = viewMonth <= MIN_MONTH;
  nextBtn.disabled = viewMonth >= MAX_MONTH;

  const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const dayCount = new Date(Date.UTC(y, m, 0)).getUTCDate();

  const cells = DOW.map((name, i) => {
    const tone = i === 0 ? ' sun' : (i === 6 ? ' sat' : '');
    return '<div class="cal-dow' + tone + '">' + name + '</div>';
  });

  for (let i = 0; i < lead; i++) cells.push('<div class="cal-cell empty"></div>');

  for (let d = 1; d <= dayCount; d++) {
    const key = viewMonth + '-' + String(d).padStart(2, '0');
    const items = DATA[key];
    if (!items) {
      cells.push('<div class="cal-cell">' + d + '</div>');
      continue;
    }
    const sel = key === selected ? ' selected' : '';
    cells.push(
      '<button type="button" class="cal-cell has-news' + sel + '"'
      + ' data-date="' + key + '" aria-label="' + key + ' ' + items.length + '件">'
      + d + '<span class="cal-count">' + items.length + '</span></button>'
    );
  }

  calGrid.innerHTML = cells.join('');
}

prevBtn.addEventListener('click', () => { viewMonth = shiftMonth(viewMonth, -1); renderCalendar(); });
nextBtn.addEventListener('click', () => { viewMonth = shiftMonth(viewMonth, 1); renderCalendar(); });

const dayHead = document.getElementById('day-head');
const cardGrid = document.getElementById('card-grid');
const audioPanel = document.getElementById('audio-panel');
const audioPlayer = document.getElementById('audio-player');
const audioPlayButton = document.getElementById('audio-play');
const audioSeekInput = document.getElementById('audio-seek');
const audioPlayedBar = document.getElementById('audio-played');
const audioBufferedBar = document.getElementById('audio-buffered');
const audioCurrentTimeLabel = document.getElementById('audio-current');
const audioDurationLabel = document.getElementById('audio-duration');
const audioRewindButton = document.getElementById('audio-rewind');
const audioForwardButton = document.getElementById('audio-forward');
const audioSpeedButtons = [...document.querySelectorAll('[data-audio-rate]')];
const audioTitleHeading = document.getElementById('audio-title');
const audioHeardCheckbox = document.getElementById('audio-heard');
const audioHeardStore = AudioHeard.createAudioHeardStore((() => {
  try { return window.localStorage; } catch (e) { return null; }
})());
let selectedAudioRate = 1;

/* 出典URLのホスト名をキッカー表示用に整える。 */
function hostOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '').toUpperCase();
  } catch (e) {
    return 'SOURCE';
  }
}

/*
 * body 中の <strong>...</strong> だけを許可し、それ以外の < > & " ' はすべて
 * エンティティ化する。generate_daily_data.py は **強調** を <strong> に変換するのみで
 * 本文中の < > & 等を一切エスケープしないため、外部由来の記事タイトル・要約に
 * 生の記号が混ざっていても、ここで無害化してから innerHTML に渡す。
 * <strong> / </strong> という厳密な形の文字列だけを区切りとして温存するため、
 * "<strong onclick=...>" のような細工されたタグは区切りにマッチせず、
 * 通常のテキストとして丸ごとエスケープされる。
 */
function escapeExceptStrong(text) {
  return String(text)
    .split(/(<\/?strong>)/g)
    .map(part => {
      if (part === '<strong>' || part === '</strong>') return part;
      return part
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    })
    .join('');
}

/* http/https 以外のスキーム（javascript: 等）を弾く。不正な URL や URL パース不能な場合は null。 */
function safeHref(url) {
  try {
    const u = new URL(url);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? url : null;
  } catch (e) {
    return null;
  }
}

/* 音声は生成スクリプトが作るGitHub Releases（タグ: audio）のURLか、ローカル配置の相対パスだけを再生対象にする。 */
const AUDIO_SRC_RE = /^(?:audio\/|https:\/\/github\.com\/motoki4869\/ai_news\/releases\/download\/audio\/)\d{4}-\d{2}-\d{2}\.m4a$/;

function safeAudioSrc(src) {
  const value = String(src || '');
  return AUDIO_SRC_RE.test(value) ? value : null;
}

function setAudioSkipEnabled(enabled) {
  audioRewindButton.disabled = !enabled;
  audioForwardButton.disabled = !enabled;
  audioPlayButton.disabled = !enabled;
  // シークは長さが分かってから解禁する（renderAudioDuration が判断する）。
  if (!enabled) audioSeekInput.disabled = true;
  else renderAudioDuration();
}

/* ===== 自作プレイヤーの表示更新 =====
   ブラウザ標準の <audio controls> をやめ、再生ボタン・シークバー・時間表示を自前で描く。
   標準のコントロールはブラウザごとに見た目が違い、このサイトの配色に合わせられないため。
   音を鳴らす仕組み自体は <audio> のままで、ここがやるのは状態の読み書きだけ。 */

/* シーク中はユーザーが動かしたつまみの位置を正とする。再生中は timeupdate が毎秒
   飛んでくるので、ドラッグやキー操作の最中にそちらへ書き戻されないようにするための札。 */
let audioScrubbing = false;

function audioDurationSeconds() {
  return Number.isFinite(audioPlayer.duration) ? Math.max(0, audioPlayer.duration) : 0;
}

/* 音声の長さが確定したとき（loadedmetadata / durationchange）。
   シークバーの目盛りを「秒」にしておくと、矢印キー1回がちょうど1秒送りになる。 */
function renderAudioDuration() {
  const duration = audioDurationSeconds();
  audioDurationLabel.textContent = AudioPlayerUI.formatTime(duration || Number.NaN);
  audioSeekInput.max = String(Math.max(1, Math.round(duration)));
  audioSeekInput.disabled = !duration || audioPlayButton.disabled;
}

function renderAudioProgress() {
  const duration = audioDurationSeconds();
  const current = Number.isFinite(audioPlayer.currentTime) ? audioPlayer.currentTime : 0;

  audioCurrentTimeLabel.textContent = AudioPlayerUI.formatTime(current);
  audioPlayedBar.style.width = AudioPlayerUI.percentOf(current, duration) + '%';
  audioBufferedBar.style.width = AudioPlayerUI.percentOf(AudioPlayerUI.bufferedEnd(audioPlayer), duration) + '%';
  if (!audioScrubbing) audioSeekInput.value = String(Math.round(current));
  // 「1:23 / 12:34」のように、つまみの位置を音声として読み上げさせる。
  audioSeekInput.setAttribute('aria-valuetext',
    AudioPlayerUI.formatTime(current) + ' / ' + AudioPlayerUI.formatTime(duration || Number.NaN));
}

function renderAudioPlayState() {
  const playing = !audioPlayer.paused && !audioPlayer.ended;
  audioPlayButton.classList.toggle('is-playing', playing);
  audioPlayButton.setAttribute('aria-label', playing ? '一時停止' : '再生');
}

/* 日付を切り替えたときなど、別の音声を読み込む前に表示を0へ戻す。 */
function resetAudioUI() {
  audioScrubbing = false;
  audioSeekInput.value = '0';
  audioPlayedBar.style.width = '0%';
  audioBufferedBar.style.width = '0%';
  audioCurrentTimeLabel.textContent = AudioPlayerUI.formatTime(0);
  audioDurationLabel.textContent = AudioPlayerUI.formatTime(Number.NaN);
  renderAudioPlayState();
}

audioPlayButton.addEventListener('click', () => {
  // play() は Promise を返し、ユーザー操作が無い等の理由で拒否されることがある。
  // 拒否されても再生状態は paused のままなので、表示を合わせ直すだけでよい。
  if (audioPlayer.paused || audioPlayer.ended) {
    const started = audioPlayer.play();
    if (started && typeof started.catch === 'function') started.catch(renderAudioPlayState);
  } else {
    audioPlayer.pause();
  }
});

audioSeekInput.addEventListener('pointerdown', () => { audioScrubbing = true; });
audioSeekInput.addEventListener('keydown', () => { audioScrubbing = true; });
// ドラッグ／キー操作が終わったら、以降は再生位置の側を正に戻す。
['pointerup', 'pointercancel', 'keyup', 'change', 'blur'].forEach(type => {
  audioSeekInput.addEventListener(type, () => { audioScrubbing = false; });
});

audioSeekInput.addEventListener('input', () => {
  const duration = audioDurationSeconds();
  if (!duration) return;
  audioPlayer.currentTime = Math.min(duration, Math.max(0, Number(audioSeekInput.value)));
  renderAudioProgress();
});

audioPlayer.addEventListener('loadedmetadata', () => { renderAudioDuration(); renderAudioProgress(); });
audioPlayer.addEventListener('durationchange', renderAudioDuration);
audioPlayer.addEventListener('timeupdate', renderAudioProgress);
audioPlayer.addEventListener('progress', renderAudioProgress);
audioPlayer.addEventListener('seeked', renderAudioProgress);
audioPlayer.addEventListener('play', renderAudioPlayState);
audioPlayer.addEventListener('pause', renderAudioPlayState);
audioPlayer.addEventListener('ended', renderAudioPlayState);

function setAudioSpeedEnabled(enabled) {
  audioSpeedButtons.forEach(button => { button.disabled = !enabled; });
}

function selectAudioSpeed(rate) {
  if (!AudioSeek.setPlaybackRate(audioPlayer, rate)) return;
  selectedAudioRate = Number(rate);
  audioSpeedButtons.forEach(button => {
    const isActive = Number(button.dataset.audioRate) === selectedAudioRate;
    button.classList.toggle('is-active', isActive);
    button.setAttribute('aria-pressed', String(isActive));
  });
}

audioRewindButton.addEventListener('click', () => {
  AudioSeek.seekAudio(audioPlayer, -10);
});

audioForwardButton.addEventListener('click', () => {
  AudioSeek.seekAudio(audioPlayer, 10);
});

audioSpeedButtons.forEach(button => {
  button.addEventListener('click', () => selectAudioSpeed(button.dataset.audioRate));
});

audioHeardCheckbox.addEventListener('change', () => {
  if (selected) audioHeardStore.set(selected, audioHeardCheckbox.checked);
});

function renderDay() {
  const items = DATA[selected] || [];
  const [y, m, d] = selected.split('-').map(Number);
  const dow = DOW[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];

  dayHead.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = selected + '（' + dow + '）';
  const countSpan = document.createElement('span');
  countSpan.className = 'day-count';
  countSpan.textContent = items.length + '件';
  const lineSpan = document.createElement('span');
  lineSpan.className = 'day-line';
 dayHead.append(h2, countSpan, lineSpan);

  const audio = AUDIO[selected];
  const audioSrc = audio && safeAudioSrc(audio.src);
  if (audioSrc) {
    const title = audio.title || audio.label || (selected + 'のAIニュース音声');
    audioPanel.hidden = false;
    audioTitleHeading.textContent = title;
    audioPlayer.src = audioSrc;
    // 日付を切り替えると別の音声になるので、前の日の再生位置・長さの表示を消す。
    resetAudioUI();
    setAudioSkipEnabled(true);
    setAudioSpeedEnabled(true);
    selectAudioSpeed(selectedAudioRate);
    audioHeardCheckbox.disabled = false;
    audioHeardCheckbox.checked = audioHeardStore.has(selected);
  } else {
    audioTitleHeading.textContent = '今日のニュースを音声で聴く';
    audioPlayer.removeAttribute('src');
    audioPlayer.load();
    resetAudioUI();
    audioPanel.hidden = true;
    setAudioSkipEnabled(false);
    setAudioSpeedEnabled(false);
    audioHeardCheckbox.disabled = true;
    audioHeardCheckbox.checked = false;
  }

  cardGrid.innerHTML = '';
  items.forEach(item => {
    const article = document.createElement('article');
    article.className = 'news-card';

    const kicker = document.createElement('div');
    kicker.className = 'kicker';
    kicker.textContent = hostOf(item.url);

    const h3 = document.createElement('h3');
    h3.textContent = item.title;

    // intro だけは <strong> 強調を許可するため innerHTML を使うが、
    // escapeExceptStrong() でそれ以外の記号を無害化してから渡す。
    const p = document.createElement('p');
    p.innerHTML = escapeExceptStrong(item.intro);

    let pointList = null;
    if (item.points && item.points.length) {
      pointList = document.createElement('ul');
      pointList.className = 'point-list';
      item.points.forEach(pt => {
        const li = document.createElement('li');
        li.innerHTML = '<strong>' + escapeExceptStrong(pt.label) + '</strong>: ' + escapeExceptStrong(pt.text);
        pointList.appendChild(li);
      });
    }

    const a = document.createElement('a');
    a.className = 'card-src';
    a.textContent = '出典を読む →';
    a.target = '_blank';
    a.rel = 'noopener';
    const href = safeHref(item.url);
    if (href) {
      a.href = href;
    } else {
      a.removeAttribute('href');
      a.setAttribute('aria-disabled', 'true');
    }

    if (pointList) {
      article.append(kicker, h3, p, pointList, a);
    } else {
      article.append(kicker, h3, p, a);
    }
    cardGrid.appendChild(article);
  });

  // 再描画のたびにフェードインさせる
  requestAnimationFrame(() => {
    cardGrid.querySelectorAll('.news-card').forEach(c => c.classList.add('visible'));
  });
}

function select(date, opts) {
  if (!DATA[date]) return;
  selected = date;
  viewMonth = ym(date);
  renderCalendar();
  renderDay();
  history.replaceState(null, '', '#' + date);
  if (opts && opts.scroll) {
    const dateHeading = dayHead.querySelector('h2');
    if (dateHeading) dateHeading.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

calGrid.addEventListener('click', e => {
  const cell = e.target.closest('.cal-cell.has-news');
  if (cell) select(cell.dataset.date, { scroll: true });
});

latestBtn.addEventListener('click', () => select(LATEST, { scroll: true }));

/* ← → でニュースのある前後の日へジャンプする */
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const direction = e.key === 'ArrowLeft' ? 'previous' : 'next';
  const next = DailyNavigation.getAdjacentDate(DATES, selected, direction);
  if (next) { e.preventDefault(); select(next); }
});

/* 右スワイプで前の日、左スワイプで次の日へ移動する。 */
let touchStart = null;

dailyContent.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) {
    touchStart = null;
    return;
  }

  // カードの出典リンクや音声プレイヤーの操作を日付切り替えで奪わない。
  if (e.target.closest('a, button, input, select, textarea, audio')) {
    touchStart = null;
    return;
  }

  const touch = e.touches[0];
  touchStart = { x: touch.clientX, y: touch.clientY };
}, { passive: true });

dailyContent.addEventListener('touchend', e => {
  if (!touchStart || e.changedTouches.length !== 1) return;

  const touch = e.changedTouches[0];
  const direction = DailyNavigation.getSwipeDirection(
    touchStart.x,
    touchStart.y,
    touch.clientX,
    touch.clientY,
  );
  touchStart = null;
  if (!direction) return;

  const next = DailyNavigation.getAdjacentDate(DATES, selected, direction);
  if (next) {
    e.preventDefault();
    select(next, { scroll: true });
  }
}, { passive: false });

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (DATA[h] && h !== selected) select(h);
});

/* ===== 初期化 ===== */
if (!DATES.length) {
  emptyState.hidden = false;
  document.querySelector('.cal-wrap').hidden = true;
} else {
  const fromHash = location.hash.slice(1);
  select(DATA[fromHash] ? fromHash : LATEST);
}
</script>

</body>
</html>
